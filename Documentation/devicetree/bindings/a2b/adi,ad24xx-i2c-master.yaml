%YAML 1.2
---
$id: http://devicetree.org/schemas/a2b/adi,ad24xx-i2c-master.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices Inc. AD24xx I2C master functional block

maintainers:
  - Alvin Šipraga <alsi@bang-olufsen.dk>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml

properties:
  compatible:
    enum:
      - adi,ad2401-i2c-master
      - adi,ad2402-i2c-master
      - adi,ad2403-i2c-master
      - adi,ad2410-i2c-master
      - adi,ad2420-i2c-master
      - adi,ad2421-i2c-master
      - adi,ad2422-i2c-master
      - adi,ad2425-i2c-master
      - adi,ad2426-i2c-master
      - adi,ad2427-i2c-master
      - adi,ad2428-i2c-master

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    node@1 {
      compatible = "adi,ad2425";
      reg = <1>;
      interrupts = <1>;
      adi,tdm-mode = <16>;
      adi,tdm-slot-size = <32>;

      i2c {
        compatible = "adi,ad2425-i2c-master";
        #address-cells = <1>;
        #size-cells = <0>;
        clock-frequency = <400000>;
      };
    };
