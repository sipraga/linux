%YAML 1.2
---
$id: http://devicetree.org/schemas/a2b/adi,ad24xx-node.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices Inc. AD24xx A2B node

maintainers:
  - Alvin Šipraga <alsi@bang-olufsen.dk>

allOf:
  - $ref: a2b-node.yaml#

properties:
  compatible:
    enum:
      - adi,ad2401
      - adi,ad2402
      - adi,ad2403
      - adi,ad2410
      - adi,ad2420
      - adi,ad2421
      - adi,ad2422
      - adi,ad2425
      - adi,ad2426
      - adi,ad2427
      - adi,ad2428
      - adi,ad2429
      - beo,shape-node

  gpio:
    $ref: adi,ad24xx-gpio.yaml#

  codec:
    $ref: adi,ad24xx-codec.yaml#

  i2c:
    $ref: adi,ad24xx-i2c-master.yaml#

  clock:
    $ref: adi,ad24xx-clk.yaml#

  adi,tdm-mode:
    enum: [2, 4, 8, 12, 16, 20, 24, 32]

  adi,tdm-slot-size:
    enum: [16, 32]

  adi,invert-sync:
    type: boolean

  adi,early-sync:
    type: boolean

  adi,alternating-sync:
    type: boolean

  adi,rx-on-dtx1:
    type: boolean

  adi,drive-strength:
    description: Configures drive strength low (0) or high (1, default).
    enum: [0, 1]

  adi,invert-interrupt:
    type: boolean

  adi,tristate-interrupt:
    type: boolean

required:
  - compatible
  - adi,tdm-mode
  - adi,tdm-slot-size

unevaluatedProperties: false
