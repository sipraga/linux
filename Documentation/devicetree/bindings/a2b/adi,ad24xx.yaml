%YAML 1.2
---
$id: http://devicetree.org/schemas/a2b/adi,ad24xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices Inc. AD24xx Automotive Audio Bus A2B Transceiver

description: |
  AD24xx chips provide A2B bus functionality together with several peripheral
  functions, including GPIO, I2S/TDM, an I2C master interface, and programmable
  clock outputs.

maintainers:
  - Alvin Šipraga <alsi@bang-olufsen.dk>

properties:
  compatible:
    enum:
      - adi,ad2403
      - adi,ad2410
      - adi,ad2425
      - adi,ad2428
      - adi,ad2429

  reg-names:
    items:
      - const: base
      - const: bus

  reg:
    items:
      - description: Normal I2C address of the chip
      - description: Auxiliary BUS_ADDR I2C address of the chip

  clock-names:
    items:
      - const: sync

  clocks:
    items:
      - description: SYNC input pin clock source

  vin-supply:
    description: Optional regulator for supply voltage to VIN pin

  bus-supply:
    description: Optional regulator for out-of-band supply voltage to
      subodrinate nodes' VIN pins

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  interrupts: true

  interrupt-controller: true

  '#interrupt-cells':
    const: 1

patternProperties:
  "^node@[0-9]+$":
    $ref: a2b-node.yaml#

    unevaluatedProperties: false

required:
  - compatible
  - reg-names
  - reg
  - clock-names
  - clocks
  - '#address-cells'
  - '#size-cells'
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'
  - node@0

unevaluatedProperties: false

examples:
  - |
    sync_clk: sync-clock {
          compatible = "fixed-clock";
          #clock-cells = <0>;
          clock-frequency = <48000>;
    };

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      a2b@68 {
        compatible = "adi,ad2428";
        reg-names = "base", "bus";
        reg = <0x68>, <0x69>;
        clock-names = "sync";
        clocks = <&sync_clk>;
        #address-cells = <1>;
        #size-cells = <0>;
        interrupts = <42>;
        interrupt-controller;
        #interrupt-cells = <1>;

        node@0 {
          compatible = "adi,ad2428";
          reg = <0>;
          interrupts = <0>;
          adi,tdm-mode = <16>;
          adi,tdm-slot-size = <32>;

          codec {
            compatible = "adi,ad2428-codec";
            #sound-dai-cells = <0>;
            sound-name-prefix = "A2B Main";
          };
        };

        node@1 {
          compatible = "adi,ad2425";
          reg = <1>;
          interrupts = <1>;
          adi,tdm-mode = <8>;
          adi,tdm-slot-size = <32>;

          gpio {
            compatible = "adi,ad2425-gpio";
            interrupt-controller;
            #interrupt-cells = <2>;
            gpio-controller;
            #gpio-cells = <2>;
          };

          codec {
            compatible = "adi,ad2425-codec";
            #sound-dai-cells = <0>;
            sound-name-prefix = "A2B Sub1";
          };

          i2c {
            compatible = "adi,2425-i2c-master";
            #address-cells = <1>;
            #size-cells = <0>;

            eeprom@50 {
              compatible = "atmel,24c64";
              reg = <0x50>;
            };
          };
        };
      };
    };
